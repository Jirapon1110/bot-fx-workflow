[project]
name = "bot-fx-workflow"
version = "0.1.0"
description = "Fetch the BOT daily THB/USD weighted-average interbank rate into SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata; sys_platform == 'win32'",  # zoneinfo needs it on Windows
]

[project.scripts]
bot-fx = "bot_fx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_fx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
